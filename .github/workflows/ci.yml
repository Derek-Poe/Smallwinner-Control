name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/smallwinner
      - name: Deterministic simulator demo
        run: |
          ./smallwinner -demo -state "$RUNNER_TEMP/demo-one" > "$RUNNER_TEMP/demo-one.json"
          ./smallwinner -demo -state "$RUNNER_TEMP/demo-two" > "$RUNNER_TEMP/demo-two.json"
          cmp "$RUNNER_TEMP/demo-one.json" "$RUNNER_TEMP/demo-two.json"
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install pinned Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests, lint, and APK compilation
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Verify native boundary
        working-directory: android
        run: python3 verify_source.py
